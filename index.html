<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;

}

body{
    font-family:Segoe UI,Tahoma,sans-serif;
    background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);

.game{
    width:100%;

.title{
    font-size:22px;

}

.board{

    display:grid;
    grid-template-columns:repeat(8,1fr);
    grid-template-rows:repeat(8,1fr);
    width:100%;
    aspect-ratio:1;
    border:3px solid #ffd700;
    border-radius:7px;
    overflow:hidden;
    box-shadow:0 10px 35px rgba(0,0,0,.8);
}

.square{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
}

.light{
    background:#f0d9b5;
}

.dark{
    background:#b58863;
}

.selected{
    background:#f7ec59 !important;
}

.last{
    box-shadow:inset 0 0 0 999px rgba(155,199,0,.38);
}

.valid::after{
    content:"";
    width:28%;
    height:28%;
    border-radius:50%;
    background:rgba(0,0,0,.35);
    position:absolute;
}

.capture{
    box-shadow:inset 0 0 0 5px rgba(220,30,30,.55);
}

.check{
    background:#d22 !important;
    animation:pulse 1s infinite;
}

@keyframes pulse{
    50%{
        box-shadow:inset 0 0 25px red;
    }
}

.piece{
    width:92%;
    height:92%;
    pointer-events:none;
    z-index:2;
}

.piece svg{
    width:100%;
    height:100%;
}

.captured{
    margin-top:10px;
    background:rgba(0,0,0,.25);
    border-radius:10px;
    padding:6px;
    min-height:28px;
    font-size:18px;
}

.result{
    display:none;
    margin-top:12px;
    padding:15px;
    background:rgba(0,0,0,.65);
    border:2px solid #ffd700;
    border-radius:15px;
    text-align:center;
}

.result.show{
    display:block;
}

.result-title{
    font-size:20px;
    font-weight:bold;
    color:#ffd700;
    margin-bottom:10px;
}

button{
    width:100%;
    border:0;
    border-radius:10px;
    padding:12px;
    background:linear-gradient(135deg,#ffd700,#ff9800);
    color:#111;
    font-weight:bold;

}

.thinking{
    display:none;
    text-align:center;
    color:#ffd700;
    margin-bottom:8px;
}

.thinking.show{
    display:block;
}

.promotion{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.85);
    z-index:20;
    align-items:center;
    justify-content:center;
}

.promotion.show{
    display:flex;
}

.promo-box{
    background:#17152d;
    border:2px solid #ffd700;
    border-radius:16px;
    padding:20px;
    text-align:center;
}

.promo-buttons{

    gap:10px;
    margin-top:15px;
}

.promo{
    width:65px;
    height:65px;
    padding:5px;
    background:rgba(255,255,255,.1);
}

.promo svg{
    width:100%;
    height:100%;
}

<script>

let user = app?.initDataUnsafe?.user || null;


/* =========================

const PIECES = {

fill="black" stroke="white" stroke-width="1.5"/>

};


/* =========================
   وضعیت بازی
========================= */

let board=[];
let turn='w';

let playerColor='w';
let botColor='b';

let selected=null;
let legalMoves=[];

let gameOver=false;

let lastFrom=-1;
let lastTo=-1;

let enPassant=-1;

let castling={
    wK:true,
    wQ:true,
    bK:true,
    bQ:true
};

let captured=[];


/* =========================
   صفحه شروع استاندارد
========================= */

function initBoard(){

    board=[

        'r','n','b','q','k','b','n','r',

        'p','p','p','p','p','p','p','p',

        '','','','','','','',

        '','','','','','','',

        '','','','','','','',

        '','','','','','','',

        'P','P','P','P','P','P','P','P',

        'R','N','B','Q','K','B','N','R'

    ];

}


/* =========================
   توابع پایه
========================= */

function color(p){

    if(!p) return null;

    return p===p.toUpperCase()?'w':'b';

}

function rc(i){

    return {
        r:Math.floor(i/8),
        c:i%8
    };

}

function index(r,c){

    return r*8+c;

}

function inside(r,c){

    return r>=0 && r<8 && c>=0 && c<8;

}

function findKing(side){

    const king=side==='w'?'K':'k';

    return board.indexOf(king);

}


/* =========================
   حمله به خانه
========================= */

function attacked(square,bySide){

    const {r,c}=rc(square);

    const knight=bySide==='w'?'N':'n';

    const knightMoves=[
        [-2,-1],[-2,1],
        [-1,-2],[-1,2],
        [1,-2],[1,2],
        [2,-1],[2,1]
    ];

    for(const [dr,dc] of knightMoves){

        const nr=r+dr;
        const nc=c+dc;

        if(
            inside(nr,nc) &&
            board[index(nr,nc)]===knight
        ) return true;

    }


    const pawn=bySide==='w'?'P':'p';

    const pawnDir=bySide==='w'?-1:1;

    for(const dc of [-1,1]){

        const nr=r+pawnDir;
        const nc=c+dc;

        if(
            inside(nr,nc) &&
            board[index(nr,nc)]===pawn
        ) return true;

    }


    const king=bySide==='w'?'K':'k';

    for(let dr=-1;dr<=1;dr++){

        for(let dc=-1;dc<=1;dc++){

            if(!dr&&!dc) continue;

            const nr=r+dr;
            const nc=c+dc;

            if(
                inside(nr,nc) &&
                board[index(nr,nc)]===king
            ) return true;

        }

    }


    const rook=bySide==='w'?'R':'r';
    const queen=bySide==='w'?'Q':'q';

    const straight=[
        [1,0],[-1,0],
        [0,1],[0,-1]
    ];

    for(const [dr,dc] of straight){

        let nr=r+dr;
        let nc=c+dc;

        while(inside(nr,nc)){

            const p=board[index(nr,nc)];

            if(p){

                if(p===rook || p===queen)
                    return true;

                break;

            }

            nr+=dr;
            nc+=dc;

        }

    }


    const bishop=bySide==='w'?'B':'b';

    const diagonal=[
        [1,1],
        [1,-1],
        [-1,1],
        [-1,-1]
    ];

    for(const [dr,dc] of diagonal){

        let nr=r+dr;
        let nc=c+dc;

        while(inside(nr,nc)){

            const p=board[index(nr,nc)];

            if(p){

                if(p===bishop || p===queen)
                    return true;

                break;

            }

            nr+=dr;
            nc+=dc;

        }

    }

    return false;

}


function inCheck(side){

    const king=findKing(side);

    if(king<0) return false;

    return attacked(
        king,
        side==='w'?'b':'w'
    );

}


/* =========================
   حرکت خام
========================= */

function pseudoMoves(side){

    const moves=[];

    for(let from=0;from<64;from++){

        const p=board[from];

        if(!p || color(p)!==side) continue;

        const {r,c}=rc(from);

        const type=p.toLowerCase();


        /* سرباز */

        if(type==='p'){

            const dir=side==='w'?-1:1;

            const start=side==='w'?6:1;

            const promo=side==='w'?0:7;

            let nr=r+dir;

            if(inside(nr,c) && !board[index(nr,c)]){

                if(nr===promo){

                    for(const x of ['q','r','b','n']){

                        moves.push({
                            from,
                            to:index(nr,c),
                            promotion:x
                        });

                    }

                }else{

                    moves.push({
                        from,
                        to:index(nr,c)
                    });

                    if(r===start){

                        const nr2=r+dir*2;

                        if(!board[index(nr2,c)]){

                            moves.push({
                                from,
                                to:index(nr2,c)
                            });

                        }

                    }

                }

            }


            for(const dc of [-1,1]){

                const nc=c+dc;

                if(!inside(nr,nc)) continue;

                const to=index(nr,nc);

                const target=board[to];

                if(target && color(target)!==side){

                    if(nr===promo){

                        for(const x of ['q','r','b','n']){

                            moves.push({
                                from,
                                to,
                                promotion:x
                            });

                        }

                    }else{

                        moves.push({
                            from,
                            to
                        });

                    }

                }


                if(to===enPassant){

                    moves.push({
                        from,
                        to,
                        enPassant:true
                    });

                }

            }

        }


        /* اسب */

        else if(type==='n'){

            const jumps=[
                [-2,-1],[-2,1],
                [-1,-2],[-1,2],
                [1,-2],[1,2],
                [2,-1],[2,1]
            ];

            for(const [dr,dc] of jumps){

                const nr=r+dr;
                const nc=c+dc;

                if(!inside(nr,nc)) continue;

                const target=board[index(nr,nc)];

                if(!target || color(target)!==side){

                    moves.push({
                        from,
                        to:index(nr,nc)
                    });

                }

            }

        }


        /* فیل / رخ / وزیر */

        else if(type==='b'||type==='r'||type==='q'){

            const dirs=[];

            if(type==='b'||type==='q'){

                dirs.push(
                    [1,1],
                    [1,-1],
                    [-1,1],
                    [-1,-1]
                );

            }

            if(type==='r'||type==='q'){

                dirs.push(
                    [1,0],
                    [-1,0],
                    [0,1],
                    [0,-1]
                );

            }

            for(const [dr,dc] of dirs){

                let nr=r+dr;
                let nc=c+dc;

                while(inside(nr,nc)){

                    const to=index(nr,nc);
                    const target=board[to];

                    if(!target){

                        moves.push({
                            from,
                            to
                        });

                    }else{

                        if(color(target)!==side){

                            moves.push({
                                from,
                                to
                            });

                        }

                        break;

                    }

                    nr+=dr;
                    nc+=dc;

                }

            }

        }


        /* شاه */

        else if(type==='k'){

            for(let dr=-1;dr<=1;dr++){

                for(let dc=-1;dc<=1;dc++){

                    if(!dr&&!dc) continue;

                    const nr=r+dr;
                    const nc=c+dc;

                    if(!inside(nr,nc)) continue;

                    const to=index(nr,nc);
                    const target=board[to];

                    if(!target || color(target)!==side){

                        moves.push({
                            from,
                            to
                        });

                    }

                }

            }


            /* قلعه */

            const enemy=side==='w'?'b':'w';

            if(side==='w' && from===60){

                if(
                    castling.wK &&
                    board[61]==='' &&
                    board[62]==='' &&
                    board[63]==='R' &&
                    !attacked(60,enemy) &&
                    !attacked(61,enemy) &&
                    !attacked(62,enemy)
                ){

                    moves.push({
                        from:60,
                        to:62,
                        castle:'K'
                    });

                }


                if(
                    castling.wQ &&
                    board[59]==='' &&
                    board[58]==='' &&
                    board[57]==='' &&
                    board[56]==='R' &&
                    !attacked(60,enemy) &&
                    !attacked(59,enemy) &&
                    !attacked(58,enemy)
                ){

                    moves.push({
                        from:60,
                        to:58,
                        castle:'Q'
                    });

                }

            }


            if(side==='b' && from===4){

                if(
                    castling.bK &&
                    board[5]==='' &&
                    board[6]==='' &&
                    board[7]==='r' &&
                    !attacked(4,enemy) &&
                    !attacked(5,enemy) &&
                    !attacked(6,enemy)
                ){

                    moves.push({
                        from:4,
                        to:6,
                        castle:'K'
                    });

                }


                if(
                    castling.bQ &&
                    board[3]==='' &&
                    board[2]==='' &&
                    board[1]==='' &&
                    board[0]==='r' &&
                    !attacked(4,enemy) &&
                    !attacked(3,enemy) &&
                    !attacked(2,enemy)
                ){

                    moves.push({
                        from:4,
                        to:2,
                        castle:'Q'
                    });

                }

            }

        }

    }

    return moves;

}


/* =========================
   اجرای آزمایشی حرکت
========================= */

function testMove(move){

    const oldBoard=[...board];
    const oldEp=enPassant;

    const piece=board[move.from];
    const side=color(piece);

    board[move.to]=piece;
    board[move.from]='';


    if(move.enPassant){

        const cap=side==='w'
            ?move.to+8
            :move.to-8;

        board[cap]='';

    }


    if(move.promotion){

        board[move.to]=
            side==='w'
            ?move.promotion.toUpperCase()
            :move.promotion;

    }


    if(move.castle){

        if(move.castle==='K'){

            board[move.to-1]=board[move.to+1];
            board[move.to+1]='';

        }else{

            board[move.to+1]=board[move.to-2];
            board[move.to-2]='';

        }

    }


    return {
        oldBoard,
        oldEp
    };

}


function undoTest(state){

    board=state.oldBoard;
    enPassant=state.oldEp;

}


/* =========================
   حرکت‌های قانونی
========================= */

function legalMoves(side){

    const result=[];

    for(const move of pseudoMoves(side)){

        const state=testMove(move);

        const safe=!inCheck(side);

        undoTest(state);

        if(safe){

            result.push(move);

        }

    }

    return result;

}


/* =========================
   انجام حرکت واقعی
========================= */

function makeMove(move){

    const piece=board[move.from];
    const side=color(piece);
    const captured=board[move.to];

    if(captured){

        captured.push(captured);

    }

    board[move.to]=piece;
    board[move.from]='';


    if(move.enPassant){

        const cap=side==='w'
            ?move.to+8
            :move.to-8;

        board[cap]='';

    }


    if(move.promotion){

        board[move.to]=
            side==='w'
            ?move.promotion.toUpperCase()
            :move.promotion;

    }


    if(move.castle){

        if(move.castle==='K'){

            board[move.to-1]=board[move.to+1];
            board[move.to+1]='';

        }else{

            board[move.to+1]=board[move.to-2];
            board[move.to-2]='';

        }

    }


    /* حق قلعه */

    if(piece==='K'){

        castling.wK=false;
        castling.wQ=false;

    }

    if(piece==='k'){

        castling.bK=false;
        castling.bQ=false;

    }

    if(move.from===63) castling.wK=false;
    if(move.from===56) castling.wQ=false;
    if(move.from===7) castling.bK=false;
    if(move.from===0) castling.bQ=false;


    /* آن‌پاسان */

    enPassant=-1;

    if(
        piece.toLowerCase()==='p' &&
        Math.abs(
            rc(move.from).r-
            rc(move.to).r
        )===2
    ){

        enPassant=
            (move.from+move.to)/2;

    }


    lastFrom=move.from;
    lastTo=move.to;

    turn=turn==='w'?'b':'w';

    selected=null;
    legalMoves=[];

    render();

    checkState();

}


/* =========================
   کلیک روی خانه
========================= */

function clickSquare(i){

    if(gameOver) return;

    if(turn!==playerColor) return;


    const piece=board[i];


    if(selected!==null){

        const possible=
            legalMoves.filter(m=>m.to===i);

        if(possible.length){

            const promotionMove=
                possible.find(m=>m.promotion);

            if(promotionMove){

                openPromotion(promotionMove);

                return;

            }

            makeMove(possible[0]);

            if(!gameOver && turn===botColor){

                setTimeout(botMove,450);

            }

            return;

        }


        if(
            piece &&
            color(piece)===playerColor
        ){

            selectPiece(i);

            return;

        }


        selected=null;
        legalMoves=[];
        render();

        return;

    }


    if(
        piece &&
        color(piece)===playerColor
    ){

        selectPiece(i);

    }

}


function selectPiece(i){

    selected=i;

    legalMoves=
        legalMovesForPlayer();

    legalMoves=
        legalMoves.filter(m=>m.from===i);

    render();

}


function legalMovesForPlayer(){

    return legalMovesAll(playerColor);

}


function legalMovesAll(side){

    return legalMoves(side);

}


/* =========================
   ارتقای سرباز
========================= */

function openPromotion(base){

    const modal=
        document.getElementById('promotion');

    const box=
        document.getElementById('promoButtons');

    box.innerHTML='';


    for(const type of ['q','r','b','n']){

        const button=
            document.createElement('button');

        button.className='promo';

        const piece=
            playerColor==='w'
            ?type.toUpperCase()
            :type;

        button.innerHTML=PIECES[piece];

        button.onclick=()=>{

            modal.classList.remove('show');

            base.promotion=type;

            makeMove(base);

            if(!gameOver && turn===botColor){

                setTimeout(botMove,450);

            }

        };

        box.appendChild(button);

    }

    modal.classList.add('show');

}


/* =========================
   نمایش صفحه
========================= */

function render(){

    const el=
        document.getElementById('board');

    el.innerHTML='';


    const check=
        inCheck(turn);

    const king=
        findKing(turn);


    for(let display=0;display<64;display++){

        /*
          چون بازیکن سیاه هم ممکن است بازی کند،
          صفحه برای او برعکس نمایش داده می‌شود.
        */

        const actual=
            playerColor==='b'
            ?63-display
            :display;

        const {r,c}=rc(actual);

        const square=
            document.createElement('div');

        square.className=
            'square '+
            (((r+c)%2===0)
                ?'light'
                :'dark');


        if(actual===selected){

            square.classList.add('selected');

        }


        if(
            actual===lastFrom ||
            actual===lastTo
        ){

            square.classList.add('last');

        }


        if(
            check &&
            actual===king
        ){

            square.classList.add('check');

        }


        const move=
            legalMoves.find(
                m=>m.to===actual
            );


        if(move){

            if(board[actual]){

                square.classList.add('capture');

            }else{

                square.classList.add('valid');

            }

        }


        const piece=board[actual];

        if(piece){

            const holder=
                document.createElement('div');

            holder.className='piece';

            holder.innerHTML=
                PIECES[piece];

            square.appendChild(holder);

        }


        square.onclick=
            ()=>clickSquare(actual);


        el.appendChild(square);

    }


    document.getElementById('captured').textContent=
        'گرفته‌شده‌ها: '+
        captured.join(' ');


    updateStatus();

}


/* =========================
   وضعیت بازی
========================= */

function checkState(){

    const moves=
        legalMoves(turn);

    const check=
        inCheck(turn);

    if(!moves.length){

        gameOver=true;

        const result=
            document.getElementById('result');

        const title=
            document.getElementById('resultTitle');


        result.classList.add('show');


        if(check){

            if(turn===playerColor){

                title.textContent=
                    '😔 کیش و مات! ربات برنده شد';

            }else{

                title.textContent=
                    '🏆 کیش و مات! شما برنده شدید';

            }

        }else{

            title.textContent=
                '🤝 پات! بازی مساوی شد';

        }

    }

}


/* =========================
   وضعیت بالا
========================= */

function updateStatus(){

    const status=
        document.getElementById('status');

    if(gameOver) return;


    const side=
        turn==='w'
        ?'سفید'
        :'سیاه';


    if(turn===playerColor){

        status.textContent=
            `نوبت شما (${side})`;

    }else{

        status.textContent=
            `نوبت ربات (${side})`;

    }


    if(inCheck(turn)){

        status.textContent+=' — ⚠️ کیش';

    }

}


/* =========================
   ربات
========================= */

function botMove(){

    if(
        gameOver ||
        turn!==botColor
    ) return;


    const thinking=
        document.getElementById('thinking');

    thinking.classList.add('show');


    setTimeout(()=>{

        const moves=
            legalMoves(botColor);


        if(!moves.length){

            thinking.classList.remove('show');

            checkState();

            return;

        }


        /*
          ربات فعلاً از بین حرکت‌های قانونی
          حرکت‌های گرفتن مهره را ترجیح می‌دهد.
        */

        const captures=
            moves.filter(
                m=>board[m.to]
            );


        let pool=
            captures.length
            ?captures
            :moves;


        const move=
            pool[
                Math.floor(
                    Math.random()*pool.length
                )
            ];


        makeMove(move);


        thinking.classList.remove('show');

    },600);

}


/* =========================
   بازی جدید
========================= */

function newGame(){

    gameOver=false;

    selected=null;

    legalMoves=[];

    lastFrom=-1;

    lastTo=-1;

    enPassant=-1;

    captured=[];

    castling={
        wK:true,
        wQ:true,
        bK:true,
        bQ:true
    };


    /*
      رنگ بازیکن تصادفی
    */

    if(Math.random()<.5){

        playerColor='w';
        botColor='b';

    }else{

        playerColor='b';
        botColor='w';

    }


    document
        .getElementById('result')
        .classList.remove('show');


    initBoard();

    turn='w';

    render();


    if(botColor==='w'){

        setTimeout(botMove,500);

    }

}


/* =========================
   اطلاعات کاربر بله
========================= */

if(user){

    const fullName=
        [
            user.first_name,
            user.last_name
        ]
        .filter(Boolean)
        .join(' ') ||
        'کاربر';


    document.getElementById('name')
        .textContent=fullName;


    document.getElementById('details')
        .textContent=
        user.username
        ?'@'+user.username
        :'بازیکن شطرنج';


    document.getElementById('avatar')
        .textContent=
        (user.first_name||'?')
        .charAt(0);

}


/* شروع */

newGame();

</script>
