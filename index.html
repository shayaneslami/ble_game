<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>شطرنج شایان</title>
    <script src="https://tapi.bale.ai/miniapp.js?3"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; touch-action: manipulation; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh; color: #fff; padding: 8px; overflow-x: hidden;
        }
        .game-container { max-width: 450px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
        .user-panel {
            background: rgba(255,255,255,0.05); backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 14px;
            padding: 10px; display: flex; align-items: center; gap: 10px;
        }
        .user-avatar {
            width: 50px; height: 50px; border-radius: 50%;
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem; font-weight: bold; color: #1a1a2e;
            overflow: hidden; flex-shrink: 0;
        }
        .user-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
        .user-info { flex: 1; min-width: 0; }
        .user-name { font-size: 1rem; font-weight: bold; color: #ffd700; }
        .user-details { font-size: 0.7rem; color: #aaa; margin-top: 2px; }
        .panel {
            background: rgba(255,255,255,0.05); backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 14px;
            padding: 12px; display: flex; flex-direction: column; gap: 8px;
        }
        .panel h1 {
            font-size: 1.2rem; text-align: center;
            background: linear-gradient(to right, #ffd700, #ffaa00);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 900;
        }
        .status {
            text-align: center; font-size: 0.9rem; padding: 8px;
            background: rgba(0,0,0,0.3); border-radius: 8px;
            font-weight: bold; min-height: 35px;
            display: flex; align-items: center; justify-content: center;
        }
        .thinking { display: none; align-items: center; justify-content: center; gap: 6px; color: #ffd700; font-size: 0.8rem; }
        .thinking.active { display: flex; }
        .spinner { width: 12px; height: 12px; border: 2px solid rgba(255,215,0,0.3); border-top-color: #ffd700; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .captured-row { display: flex; align-items: center; gap: 6px; }
        .captured-row small { color: #aaa; font-size: 0.65rem; white-space: nowrap; }
        .captured-area { display: flex; flex-wrap: wrap; gap: 1px; min-height: 24px; padding: 3px; background: rgba(0,0,0,0.2); border-radius: 6px; flex: 1; }
        .captured-area svg { width: 18px; height: 18px; }
        .board-wrapper { position: relative; width: 100%; max-width: 400px; margin: 0 auto; }
        .board {
            display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr);
            border: 2px solid #ffd700; box-shadow: 0 8px 30px rgba(0,0,0,0.8);
            border-radius: 4px; overflow: hidden; width: 100%; aspect-ratio: 1;
        }
        .square { display: flex; justify-content: center; align-items: center; cursor: pointer; position: relative; }
        .square.light { background: #f0d9b5; }
        .square.dark { background: #b58863; }
        .square.selected { background: #f7ec59 !important; }
        .square.valid-move::after { content: ''; position: absolute; width: 28%; height: 28%; background: radial-gradient(circle, rgba(0,0,0,0.4) 0%, transparent 70%); border-radius: 50%; }
        .square.valid-capture { background: radial-gradient(circle, transparent 55%, rgba(220, 38, 38, 0.6) 56%) !important; }
        .square.last-move { background: rgba(155, 199, 0, 0.45) !important; }
        .square.check { background: radial-gradient(circle, #ff0000 0%, #cc0000 40%, transparent 70%) !important; animation: pulseCheck 1s infinite; }
        @keyframes pulseCheck { 0%,100%{box-shadow:inset 0 0 10px #ff0000;} 50%{box-shadow:inset 0 0 25px #ff0000;} }
        .piece { width: 92%; height: 92%; pointer-events: none; filter: drop-shadow(1px 2px 2px rgba(0,0,0,0.5)); }
        .result-panel {
            display: none; background: rgba(0,0,0,0.6); backdrop-filter: blur(10px);
            border: 2px solid #ffd700; border-radius: 14px; padding: 15px;
            text-align: center; animation: slideIn 0.5s ease-out;
        }
        .result-panel.active { display: block; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        .result-icon { font-size: 3rem; margin-bottom: 10px; }
        .result-title { font-size: 1.3rem; font-weight: bold; margin-bottom: 5px; }
        .result-title.win { color: #4ade80; }
        .result-title.lose { color: #f87171; }
        .result-title.draw { color: #fbbf24; }
        .result-subtitle { font-size: 0.85rem; color: #aaa; margin-bottom: 12px; }
        .btn {
            padding: 10px; border: none; border-radius: 8px; font-size: 0.9rem;
            font-weight: bold; cursor: pointer;
            background: linear-gradient(135deg, #ffd700, #ffaa00); color: #1a1a2e; width: 100%;
        }
        .btn:active { transform: scale(0.97); }
        .send-status { font-size: 0.75rem; color: #ffd700; text-align: center; min-height: 18px; margin-top: 5px; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; }
        .modal-overlay.active { display: flex; }
        .modal { background: #1a1a2e; border: 2px solid #ffd700; border-radius: 14px; padding: 20px; text-align: center; max-width: 90%; }
        .promo-pieces { display: flex; gap: 10px; margin-top: 12px; justify-content: center; }
        .promo-piece { cursor: pointer; padding: 6px; border-radius: 8px; background: rgba(255,255,255,0.1); }
        .promo-piece:active { background: #ffd700; }
        .promo-piece svg { width: 40px; height: 40px; }
    </style>
</head>
<body>

<div class="game-container" id="captureArea">
    <div class="user-panel">
        <div class="user-avatar" id="userAvatar">?</div>
        <div class="user-info">
            <div class="user-name" id="userName">در حال بارگذاری...</div>
            <div class="user-details" id="userDetails"></div>
        </div>
    </div>

    <div class="panel">
        <h1>♟️ شطرنج شایان</h1>
        <div class="status" id="status">در حال بارگذاری...</div>
        <div class="thinking" id="thinking">
            <div class="spinner"></div>
            <span>ربات در حال فکر کردن...</span>
        </div>

        <div class="captured-row">
            <small>گرفته توسط شما:</small>
            <div class="captured-area" id="captured-white"></div>
        </div>
        <div class="captured-row">
            <small>گرفته توسط ربات:</small>
            <div class="captured-area" id="captured-black"></div>
        </div>
    </div>

    <div class="board-wrapper">
        <div class="board" id="board"></div>
    </div>

    <div class="result-panel" id="resultPanel">
        <div class="result-icon" id="resultIcon">🏆</div>
        <div class="result-title" id="resultTitle"></div>
        <div class="result-subtitle" id="resultSubtitle"></div>
        <button class="btn" onclick="resetGame()"> بازی جدید</button>
        <div class="send-status" id="sendStatus"></div>
    </div>
</div>

<div class="modal-overlay" id="promoModal">
    <div class="modal">
        <h2>ارتقاء سرباز</h2>
        <p>مهره را انتخاب کنید:</p>
        <div class="promo-pieces" id="promoChoices"></div>
    </div>
</div>

<script>
let baleApp = window.Bale?.WebApp;
let currentUser = null;
let playerColor = 'w';
let botColor = 'b';
let boardFlipped = false;

if (baleApp) {
    baleApp.ready();
    baleApp.expand();
    if (baleApp.setHeaderColor) baleApp.setHeaderColor('#0f0c29');
    currentUser = baleApp.initDataUnsafe?.user;
}

// رنگ رندوم
function assignRandomColors() {
    if (Math.random() < 0.5) {
        playerColor = 'w'; botColor = 'b'; boardFlipped = false;
    } else {
        playerColor = 'b'; botColor = 'w'; boardFlipped = true;
    }
}

// گرفتن عکس پروفایل از API بله
async function loadProfilePhoto() {
    const avatarEl = document.getElementById('userAvatar');
    const nameEl = document.getElementById('userName');
    const detailsEl = document.getElementById('userDetails');
    
    if (!currentUser) {
        nameEl.textContent = 'کاربر مهمان';
        detailsEl.textContent = ' نامشخص';
        return;
    }
    
    const firstName = currentUser.first_name || '';
    const lastName = currentUser.last_name || '';
    const username = currentUser.username ? '@' + currentUser.username : '';
    const userId = currentUser.id || '';
    const fullName = (firstName + ' ' + lastName).trim() || 'کاربر';
    
    nameEl.textContent = fullName;
    detailsEl.textContent = `🆔 ${userId} ${username ? '| ' + username : ''}`;
    avatarEl.textContent = firstName.charAt(0).toUpperCase() || '?';
    
    // تلاش برای گرفتن عکس پروفایل از API بله
    try {
        const BOT_TOKEN = "379865504:NYV6ti5zH5-BWYpwlTaERP-3fOfDmkJaJwc";
        const response = await fetch(`https://tapi.bale.ai/bot${BOT_TOKEN}/getUserProfilePhotos?user_id=${userId}&limit=1`);
        const data = await response.json();
        
        if (data.ok && data.result && data.result.total_count > 0) {
            const fileId = data.result.photos[0][0].file_id;
            const fileResponse = await fetch(`https://tapi.bale.ai/bot${BOT_TOKEN}/getFile?file_id=${fileId}`);
            const fileData = await fileResponse.json();
            
            if (fileData.ok && fileData.result) {
                const filePath = fileData.result.file_path;
                const photoUrl = `https://tapi.bale.ai/file/bot${BOT_TOKEN}/${filePath}`;
                
                const img = new Image();
                img.onload = function() {
                    avatarEl.innerHTML = '';
                    avatarEl.appendChild(img);
                };
                img.onerror = function() {
                    avatarEl.textContent = firstName.charAt(0).toUpperCase() || '?';
                };
                img.src = photoUrl;
            }
        }
    } catch(e) {
        console.log('Profile photo load failed:', e);
    }
}

assignRandomColors();
loadProfilePhoto();

    q: [-20,-10,-10,-5,-5,-10,-10,-20,-10,0,0,0,0,0,0,-10,-10,0,5,5,5,5,0,-10,-5,0,5,5,5,5,0,-5,0,0,5,5,5,5,0,-5,-10,5,5,5,5,5,0,-10,-10,0,5,0,0,0,0,-10,-20,-10,-10,-5,-5,-10,-10,-20],
    k: [-30,-40,-40,-50,-50,-40,-40,-30,-30,-40,-40,-50,-50,-40,-40,-30,-30,-40,-40,-50,-50,-40,-40,-30,-30,-40,-40,-50,-50,-40,-40,-30,-20,-30,-30,-40,-40,-30,-30,-20,-10,-20,-20,-20,-20,-20,-20,-10,20,20,0,0,0,0,20,20,20,30,10,0,0,10,30,20]
};

let board=[], turn='w', selected=null, validMoves=[], history=[];
let capturedByWhite=[], capturedByBlack=[];
let gameOver=false, lastMoveFrom=-1, lastMoveTo=-1;
let castlingRights={wK:true,wQ:true,bK:true,bQ:true};
let enPassantTarget=-1, moveNumber=1;
let lastGameResult=null;
const BOT_TOKEN = "379865504:NYV6ti5zH5-BWYpwlTaERP-3fOfDmkJaJwc";

function initBoard(){
    board=['r','n','b','q','k','b','n','r','p','p','p','p','p','p','p','p','','','','','','','','','','','','','','','','','','','','','','','P','P','P','P','P','P','P','P','R','N','B','Q','K','B','N','R'];
}

function isWhite(p){return p&&p===p.toUpperCase();}
function isBlack(p){return p&&p===p.toLowerCase();}
function colorOf(p){return p?(isWhite(p)?'w':'b'):null;}
function rc(i){return{r:Math.floor(i/8),c:i%8};}
function idx(r,c){return r*8+c;}
function inBounds(r,c){return r>=0&&r<8&&c>=0&&c<8;}
function cloneState(){return{board:[...board],turn,castlingRights:{...castlingRights},enPassantTarget,capturedByWhite:[...capturedByWhite],capturedByBlack:[...capturedByBlack],lastMoveFrom,lastMoveTo,moveNumber};}
function findKing(color,brd){const king=color==='w'?'K':'k';for(let i=0;i<64;i++)if(brd[i]===king)return i;return-1;}

function isAttackedBy(sq,byColor,brd){
    const{r,c}=rc(sq);
    const kn=byColor==='w'?'N':'n';
    for(const[dr,dc]of[[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]]){const nr=r+dr,nc=c+dc;if(inBounds(nr,nc)&&brd[idx(nr,nc)]===kn)return true;}
    const pd=byColor==='w'?1:-1,ep=byColor==='w'?'P':'p';
    for(const dc of[-1,1]){const nr=r+pd,nc=c+dc;if(inBounds(nr,nc)&&brd[idx(nr,nc)]===ep)return true;}
    const ek=byColor==='w'?'K':'k';
    for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){if(dr===0&&dc===0)continue;const nr=r+dr,nc=c+dc;if(inBounds(nr,nc)&&brd[idx(nr,nc)]===ek)return true;}
    const er=byColor==='w'?'R':'r',eq=byColor==='w'?'Q':'q';
    for(const[dr,dc]of[[0,1],[0,-1],[1,0],[-1,0]]){let nr=r+dr,nc=c+dc;while(inBounds(nr,nc)){const p=brd[idx(nr,nc)];if(p){if(p===er||p===eq)return true;break;}nr+=dr;nc+=dc;}}
    const eb=byColor==='w'?'B':'b';
    for(const[dr,dc]of[[1,1],[1,-1],[-1,1],[-1,-1]]){let nr=r+dr,nc=c+dc;while(inBounds(nr,nc)){const p=brd[idx(nr,nc)];if(p){if(p===eb||p===eq)return true;break;}nr+=dr;nc+=dc;}}
    return false;
}

function isInCheck(color,brd){const k=findKing(color,brd);if(k===-1)return false;return isAttackedBy(k,color==='w'?'b':'w',brd);}

function generatePseudoMoves(color,brd,ep,cr){
    const moves=[],dir=color==='w'?-1:1,startRow=color==='w'?6:1,promoRow=color==='w'?0:7;
    for(let i=0;i<64;i++){
        const p=brd[i];if(!p||colorOf(p)!==color)continue;
        const{r,c}=rc(i),type=p.toLowerCase();
        if(type==='p'){
            const nr=r+dir;
            if(inBounds(nr,c)&&!brd[idx(nr,c)]){
                if(nr===promoRow){for(const pr of['q','r','b','n'])moves.push({from:i,to:idx(nr,c),promo:pr});}
                else{moves.push({from:i,to:idx(nr,c)});if(r===startRow){const nr2=r+dir*2;if(!brd[idx(nr2,c)])moves.push({from:i,to:idx(nr2,c)});}}
            }
            for(const dc of[-1,1]){const nc=c+dc;if(!inBounds(nr,nc))continue;const t=brd[idx(nr,nc)];if(t&&colorOf(t)!==color){if(nr===promoRow){for(const pr of['q','r','b','n'])moves.push({from:i,to:idx(nr,nc),promo:pr});}else moves.push({from:i,to:idx(nr,nc)});}if(idx(nr,nc)===ep)moves.push({from:i,to:ep,ep:true});}
        }else if(type==='n'){
            for(const[dr,dc]of[[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]]){const nr=r+dr,nc=c+dc;if(inBounds(nr,nc)&&colorOf(brd[idx(nr,nc)])!==color)moves.push({from:i,to:idx(nr,nc)});}
        }else if(type==='k'){
            for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){if(dr===0&&dc===0)continue;const nr=r+dr,nc=c+dc;if(inBounds(nr,nc)&&colorOf(brd[idx(nr,nc)])!==color)moves.push({from:i,to:idx(nr,nc)});}
            const enemy=color==='w'?'b':'w';
            if(color==='w'&&i===60){
                if(cr.wK&&brd[61]===''&&brd[62]===''&&brd[63]==='R'&&!isAttackedBy(60,enemy,brd)&&!isAttackedBy(61,enemy,brd)&&!isAttackedBy(62,enemy,brd))moves.push({from:60,to:62,castle:'K'});
                if(cr.wQ&&brd[59]===''&&brd[58]===''&&brd[57]===''&&brd[56]==='R'&&!isAttackedBy(60,enemy,brd)&&!isAttackedBy(59,enemy,brd)&&!isAttackedBy(58,enemy,brd))moves.push({from:60,to:58,castle:'Q'});
            }
            if(color==='b'&&i===4){
                if(cr.bK&&brd[5]===''&&brd[6]===''&&brd[7]==='r'&&!isAttackedBy(4,enemy,brd)&&!isAttackedBy(5,enemy,brd)&&!isAttackedBy(6,enemy,brd))moves.push({from:4,to:6,castle:'K'});
                if(cr.bQ&&brd[3]===''&&brd[2]===''&&brd[1]===''&&brd[0]==='r'&&!isAttackedBy(4,enemy,brd)&&!isAttackedBy(3,enemy,brd)&&!isAttackedBy(2,enemy,brd))moves.push({from:4,to:2,castle:'Q'});
            }
        }else{
            const dirs=[];
            if(type==='r'||type==='q')dirs.push([0,1],[0,-1],[1,0],[-1,0]);
            if(type==='b'||type==='q')dirs.push([1,1],[1,-1],[-1,1],[-1,-1]);
            for(const[dr,dc]of dirs){let nr=r+dr,nc=c+dc;while(inBounds(nr,nc)){const t=brd[idx(nr,nc)];if(t){if(colorOf(t)!==color)moves.push({from:i,to:idx(nr,nc)});break;}moves.push({from:i,to:idx(nr,nc)});nr+=dr;nc+=dc;}}
        }
    }
    return moves;
}

function makeMove(move,brd,cr,ep){
    const newBrd=[...brd],newCr={...cr};let newEp=-1;
    const piece=newBrd[move.from],captured=newBrd[move.to],type=piece.toLowerCase(),color=colorOf(piece);
    newBrd[move.to]=piece;newBrd[move.from]='';
    if(move.ep){const epCapSq=color==='w'?move.to+8:move.to-8;newBrd[epCapSq]='';}
    if(type==='p'&&Math.abs(rc(move.from).r-rc(move.to).r)===2)newEp=(move.from+move.to)/2;
    if(move.promo)newBrd[move.to]=color==='w'?move.promo.toUpperCase():move.promo.toLowerCase();
    if(move.castle){if(move.castle==='K'){newBrd[move.to-1]=newBrd[move.to+1];newBrd[move.to+1]='';}else{newBrd[move.to+1]=newBrd[move.to-2];newBrd[move.to-2]='';}}
    if(type==='k'){if(color==='w'){newCr.wK=false;newCr.wQ=false;}else{newCr.bK=false;newCr.bQ=false;}}
    if(type==='r'){if(move.from===63)newCr.wK=false;if(move.from===56)newCr.wQ=false;if(move.from===7)newCr.bK=false;if(move.from===0)newCr.bQ=false;}
    return{board:newBrd,cr:newCr,ep:newEp,captured:move.ep?(color==='w'?'p':'P'):captured};
}

function getLegalMoves(color,brd,ep,cr){
    const pseudo=generatePseudoMoves(color,brd,ep,cr),legal=[];
    for(const move of pseudo){const result=makeMove(move,brd,cr,ep);if(!isInCheck(color,result.board))legal.push(move);}
    return legal;
}

function evaluate(brd){
    let score=0;
    for(let i=0;i<64;i++){const p=brd[i];if(!p)continue;const type=p.toLowerCase(),val=PIECE_VALUES[type]||0,pst=PST[type]||[];if(isWhite(p))score+=val+(pst[i]||0);else score-=val+(pst[63-i]||0);}
    return score;
}

function minimax(brd,depth,alpha,beta,isMax,cr,ep){
    if(depth===0)return evaluate(brd);
    const color=isMax?'w':'b',moves=getLegalMoves(color,brd,ep,cr);
    if(moves.length===0){if(isInCheck(color,brd))return isMax?-99999+(3-depth)*100:99999-(3-depth)*100;return 0;}
    moves.sort((a,b)=>{const aC=brd[a.to]?PIECE_VALUES[brd[a.to].toLowerCase()]||0:0;const bC=brd[b.to]?PIECE_VALUES[brd[b.to].toLowerCase()]||0:0;return bC-aC;});
    if(isMax){let mx=-Infinity;for(const m of moves){const r=makeMove(m,brd,cr,ep);const ev=minimax(r.board,depth-1,alpha,beta,false,r.cr,r.ep);mx=Math.max(mx,ev);alpha=Math.max(alpha,ev);if(beta<=alpha)break;}return mx;}
    else{let mn=Infinity;for(const m of moves){const r=makeMove(m,brd,cr,ep);const ev=minimax(r.board,depth-1,alpha,beta,true,r.cr,r.ep);mn=Math.min(mn,ev);beta=Math.min(beta,ev);if(beta<=alpha)break;}return mn;}
}

function botMove(){
    if(gameOver||turn!==botColor)return;
    document.getElementById('thinking').classList.add('active');
    updateStatus();
    setTimeout(()=>{
        const moves=getLegalMoves(botColor,board,enPassantTarget,castlingRights);
        if(moves.length===0){endGame();return;}
        let bestMove=null;
        if(Math.random() < 0.15){
            bestMove = moves[Math.floor(Math.random()*moves.length)];
        } else {
            let bestScore=botColor==='w'?-Infinity:Infinity;
            for(const m of moves){
                const r=makeMove(m,board,castlingRights,enPassantTarget);
                const s=minimax(r.board,2,-Infinity,Infinity,botColor==='w',r.cr,r.ep);
                if(botColor==='w'){if(s>bestScore){bestScore=s;bestMove=m;}}
                else{if(s<bestScore){bestScore=s;bestMove=m;}}
            }
        }
        if(bestMove)executeMove(bestMove);
        document.getElementById('thinking').classList.remove('active');
    },600);
}

function executeMove(move){
    history.push(cloneState());
    const piece=board[move.from],color=colorOf(piece),result=makeMove(move,board,castlingRights,enPassantTarget);
    if(result.captured){if(color==='w')capturedByWhite.push(result.captured);else capturedByBlack.push(result.captured);}
    board=result.board;castlingRights=result.cr;enPassantTarget=result.ep;lastMoveFrom=move.from;lastMoveTo=move.to;
    turn=turn==='w'?'b':'w';if(turn==='w')moveNumber++;
    selected=null;validMoves=[];renderBoard();checkGameState();
    if(!gameOver&&turn===botColor)botMove();
}

function updateStatus(){
    const el=document.getElementById('status');
    const inCheck=isInCheck(turn,board);
    const colorName = turn === 'w' ? 'سفید' : 'سیاه';
    const userName = currentUser?.first_name || 'شما';
    
    if(turn===playerColor){
        el.textContent = `نوبت ${userName} (${colorName})`;
    } else {
        el.textContent = `نوبت ربات (${colorName})`;
    }
    
    if(inCheck) el.style.color='#ff6666';
    else el.style.color='#fff';
}

function checkGameState(){
    const moves=getLegalMoves(turn,board,enPassantTarget,castlingRights),inCheck=isInCheck(turn,board),el=document.getElementById('status');
    if(moves.length===0){
        gameOver=true;
        if(inCheck){
            if(turn===playerColor){
                el.textContent='کیش و مات! ربات برنده شد!';
                el.style.color='#ff4444';
                lastGameResult='lose';
                showResultPanel('lose');
            } else {
                el.textContent='کیش و مات! شما برنده شدید!';
                el.style.color='#44ff44';
                lastGameResult='win';
                showResultPanel('win');
            }
        } else {
            el.textContent='پات! بازی مساوی شد.';
            el.style.color='#ffaa00';
            lastGameResult='draw';
            showResultPanel('draw');
        }
        setTimeout(sendResultToBot, 1500);
    } else if(inCheck){
        updateStatus();
    } else {
        updateStatus();
    }
}

function endGame(){
    gameOver=true;
    const el=document.getElementById('status');
    if(isInCheck(turn,board)){
        if(turn===playerColor){el.textContent='کیش و مات! ربات برنده شد!';lastGameResult='lose';showResultPanel('lose');}
        else{el.textContent='کیش و مات! شما برنده شدید!';lastGameResult='win';showResultPanel('win');}
    } else {
        el.textContent='پات! بازی مساوی شد.';
        lastGameResult='draw';
        showResultPanel('draw');
    }
    setTimeout(sendResultToBot, 1500);
}

function showResultPanel(type){
    const panel=document.getElementById('resultPanel');
    const icon=document.getElementById('resultIcon');
    const title=document.getElementById('resultTitle');
    const subtitle=document.getElementById('resultSubtitle');
    if(type==='win'){icon.textContent='';title.textContent='تبریک! شما برنده شدید!';title.className='result-title win';subtitle.textContent='مهارت شما فوق‌العاده بود!';}
    else if(type==='lose'){icon.textContent='😔';title.textContent='متأسفانه باختید!';title.className='result-title lose';subtitle.textContent='دوباره تلاش کنید!';}
    else{icon.textContent='🤝';title.textContent='بازی مساوی شد!';title.className='result-title draw';subtitle.textContent='یک بازی برابر بود!';}
    panel.classList.add('active');
}

function handleSquareClick(i){
    if(gameOver||turn!==playerColor)return;
    const piece=board[i];
    if(selected!==null){
        const move=validMoves.find(m=>m.to===i);
        if(move){
            const promoMoves=validMoves.filter(m=>m.to===i&&m.promo);
            if(promoMoves.length>0){showPromotionModal(promoMoves[0]);return;}
            executeMove(move);return;
        }
        if(piece&&colorOf(piece)===playerColor){selectPiece(i);return;}
        selected=null;validMoves=[];renderBoard();return;
    }
    if(piece&&colorOf(piece)===playerColor)selectPiece(i);
}

function selectPiece(i){selected=i;const all=getLegalMoves(playerColor,board,enPassantTarget,castlingRights);validMoves=all.filter(m=>m.from===i);renderBoard();}

function showPromotionModal(baseMove){
    const modal=document.getElementById('promoModal'),choices=document.getElementById('promoChoices');choices.innerHTML='';
    for(const p of['Q','R','B','N']){
        const div=document.createElement('div');div.className='promo-piece';div.innerHTML=SVG_PIECES[p];
        div.onclick=()=>{const move=validMoves.find(m=>m.to===baseMove.to&&m.promo===p.toLowerCase());modal.classList.remove('active');if(move)executeMove(move);};
        choices.appendChild(div);
    }
    modal.classList.add('active');
}

function renderBoard(){
    const boardEl=document.getElementById('board');boardEl.innerHTML='';
    const inCheck=isInCheck(turn,board),kingPos=findKing(turn,board);
    
    for(let displayIdx=0;displayIdx<64;displayIdx++){
        // اگر boardFlipped=true، نمایش برعکس میشه
        const actualIdx = boardFlipped ? (63 - displayIdx) : displayIdx;
        const{r,c}=rc(actualIdx),sq=document.createElement('div'),isLight=(r+c)%2===0;
        sq.className=`square ${isLight?'light':'dark'}`;
        if(actualIdx===selected)sq.classList.add('selected');
        if(actualIdx===lastMoveFrom||actualIdx===lastMoveTo)sq.classList.add('last-move');
        if(inCheck&&actualIdx===kingPos)sq.classList.add('check');
        const isValid=validMoves.some(m=>m.to===actualIdx);
        if(isValid){if(board[actualIdx]||validMoves.some(m=>m.to===actualIdx&&m.ep))sq.classList.add('valid-capture');else sq.classList.add('valid-move');}
        if(board[actualIdx]){const div=document.createElement('div');div.className='piece';div.innerHTML=SVG_PIECES[board[actualIdx]];sq.appendChild(div);}
        sq.onclick=()=>handleSquareClick(actualIdx);boardEl.appendChild(sq);
    }
    document.getElementById('captured-white').innerHTML=capturedByWhite.map(p=>SVG_PIECES[p]).join('');
    document.getElementById('captured-black').innerHTML=capturedByBlack.map(p=>SVG_PIECES[p]).join('');
}

function resetGame(){
    assignRandomColors();
    initBoard();turn='w';selected=null;validMoves=[];history=[];capturedByWhite=[];capturedByBlack=[];gameOver=false;lastMoveFrom=-1;lastMoveTo=-1;castlingRights={wK:true,wQ:true,bK:true,bQ:true};enPassantTarget=-1;moveNumber=1;lastGameResult=null;
    document.getElementById('status').style.color='#fff';
    document.getElementById('thinking').classList.remove('active');
    document.getElementById('sendStatus').textContent='';
    document.getElementById('resultPanel').classList.remove('active');
    updateStatus();
    renderBoard();
    if(botColor==='w')setTimeout(botMove,500);
}

async function sendResultToBot(){
    if(!lastGameResult || !baleApp || !currentUser) return;
    const status = document.getElementById('sendStatus');
    status.textContent = '📸 در حال ارسال نتیجه...';
    
    try {
        const boardEl = document.getElementById('board');
        const canvas = await html2canvas(boardEl, {
            backgroundColor: null,
            scale: 2,
            useCORS: true,
            logging: false
        });
        
        canvas.toBlob(async (blob) => {
            if(!blob) {
                status.textContent = '✅ نتیجه بازی ثبت شد';
                return;
            }
            
            const formData = new FormData();
            formData.append('photo', blob, 'chess_result.png');
            
            const userId = currentUser.id;
            const firstName = currentUser.first_name || 'کاربر';
            const username = currentUser.username ? '@' + currentUser.username : '';
            
            let caption = "";
            if(lastGameResult === 'win') caption = `🏆 ${firstName} برنده شد! ${username}`;
            else if(lastGameResult === 'lose') caption = `😔 ${firstName} باخت! ${username}`;
            else caption = ` بازی ${firstName} مساوی شد! ${username}`;
            
            formData.append('chat_id', userId);
            formData.append('caption', caption);
            
            const url = `https://tapi.bale.ai/bot${BOT_TOKEN}/sendPhoto`;
            
            try {
                const response = await fetch(url, { method: 'POST', body: formData });
                const data = await response.json();
                
                if(data.ok){
                    status.textContent = '✅ نتیجه به بات ارسال شد!';
                    status.style.color = '#4ade80';
                } else {
                    // حتی اگه خطا داد، ممکنه ارسال شده باشه
                    status.textContent = '✅ بازی تمام شد';
                    status.style.color = '#4ade80';
                }
            } catch(e) {
                status.textContent = '✅ بازی تمام شد';
                status.style.color = '#4ade80';
            }
        }, 'image/png');
    } catch(e){
        console.error(e);
        status.textContent = '✅ بازی تمام شد';
    }
}

initBoard();updateStatus();renderBoard();
if(botColor==='w')setTimeout(botMove,500);
</script>
