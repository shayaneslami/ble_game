<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎮 بازی‌خانه</title>
    <script src="https://tapi.bale.ai/miniapp.js?3"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: white;
            overflow-x: hidden;
        }
        
        .container {
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        
        .title {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        .welcome {
            font-size: 18px;
            margin-bottom: 30px;
            opacity: 0.9;
        }
        
        .game-card {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        
        .game-card:active {
            transform: scale(0.95);
        }
        
        .game-card h3 {
            font-size: 20px;
            margin-bottom: 10px;
        }
        
        .game-card p {
            font-size: 14px;
            opacity: 0.8;
        }
        
        .game-screen {
            display: none;
            width: 100%;
        }
        
        .game-screen.active {
            display: block;
        }
        
        .btn {
            background: rgba(255, 255, 255, 0.3);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.5);
            padding: 15px 30px;
            border-radius: 15px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin: 10px;
            transition: all 0.2s;
        }
        
        .btn:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.4);
        }
        
        .result {
            font-size: 24px;
            font-weight: bold;
            margin: 20px 0;
            padding: 20px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 15px;
        }
        
        .emoji {
            font-size: 60px;
            margin: 20px 0;
        }
        
        .coin {
            font-size: 100px;
            animation: flip 1s ease-out;
        }
        
        @keyframes flip {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(720deg); }
        }
        
        .tictactoe-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            max-width: 300px;
            margin: 20px auto;
        }
        
        .cell {
            aspect-ratio: 1;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .cell:active {
            transform: scale(0.9);
        }
        
        .cell.x {
            color: #ff6b6b;
        }
        
        .cell.o {
            color: #4ecdc4;
        }
        
        .back-btn {
            background: rgba(255, 107, 107, 0.3);
            border: 2px solid rgba(255, 107, 107, 0.5);
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- صفحه اصلی -->
        <div id="homeScreen">
            <div class="title">🎮 بازی‌خانه</div>
            <div class="welcome" id="welcome">در حال بارگذاری...</div>
            
            <div class="game-card" onclick="showGame('rps')">
                <h3>✊ سنگ کاغذ قیچی</h3>
                <p>با بات بازی کن</p>
            </div>
            
            <div class="game-card" onclick="showGame('coin')">
                <h3>🪙 شیر یا خط</h3>
                <p>شانس خودت رو امتحان کن</p>
            </div>
            
            <div class="game-card" onclick="showGame('tictactoe')">
                <h3>⭕❌ دوز</h3>
                <p>مقابل بات بازی کن</p>
            </div>
        </div>
        
        <!-- بازی سنگ کاغذ قیچی -->
        <div id="rpsScreen" class="game-screen">
            <div class="title">✊ سنگ کاغذ قیچی</div>
            <div class="emoji" id="rpsEmoji">🎮</div>
            <div class="result" id="rpsResult">انتخاب کن:</div>
            
            <div>
                <button class="btn" onclick="playRPS('rock')">✊ سنگ</button>
                <button class="btn" onclick="playRPS('paper')">📄 کاغذ</button>
                <button class="btn" onclick="playRPS('scissors')">✂️ قیچی</button>
            </div>
            
            <button class="btn back-btn" onclick="goHome()">🔙 بازگشت</button>
        </div>
        
        <!-- بازی شیر یا خط -->
        <div id="coinScreen" class="game-screen">
            <div class="title">🪙 شیر یا خط</div>
            <div class="coin" id="coinEmoji">🪙</div>
            <div class="result" id="coinResult">انتخاب کن:</div>
            
            <div>
                <button class="btn" onclick="playCoin('shir')">🦁 شیر</button>
                <button class="btn" onclick="playCoin('khat')">🔢 خط</button>
            </div>
            
            <button class="btn back-btn" onclick="goHome()">🔙 بازگشت</button>
        </div>
        
        <!-- بازی دوز -->
        <div id="tictactoeScreen" class="game-screen">
            <div class="title">⭕❌ دوز</div>
            <div class="result" id="tttResult">نوبت تو (⭕)</div>
            
            <div class="tictactoe-board" id="tttBoard"></div>
            
            <button class="btn" onclick="resetTTT()">🔄 بازی جدید</button>
            <button class="btn back-btn" onclick="goHome()">🔙 بازگشت</button>
        </div>
    </div>
    
    <script>
        // Bale WebApp
        let tg = window.Bale?.WebApp;
        let userName = 'بازیکن';
        
        if (tg) {
            tg.ready();
            tg.expand();
            
            if (tg.initDataUnsafe?.user) {
                userName = tg.initDataUnsafe.user.first_name || 'بازیکن';
            }
            
            if (tg.setHeaderColor) {
                tg.setHeaderColor('#667eea');
            }
            
            // Back Button
            tg.BackButton.onClick(goHome);
        }
        
        document.getElementById('welcome').textContent = `سلام ${userName} 👋`;
        
        // ناوبری
        function showGame(game) {
            document.getElementById('homeScreen').style.display = 'none';
            document.getElementById(game + 'Screen').classList.add('active');
            
            if (tg) tg.BackButton.show();
            
            if (game === 'tictactoe') {
                resetTTT();
            }
        }
        
        function goHome() {
            document.querySelectorAll('.game-screen').forEach(screen => {
                screen.classList.remove('active');
            });
            document.getElementById('homeScreen').style.display = 'block';
            
            if (tg) tg.BackButton.hide();
        }
        
        // بازی سنگ کاغذ قیچی
        function playRPS(choice) {
            const choices = ['rock', 'paper', 'scissors'];
            const emojis = {rock: '✊', paper: '📄', scissors: '✂️'};
            const names = {rock: 'سنگ', paper: 'کاغذ', scissors: 'قیچی'};
            
            const botChoice = choices[Math.floor(Math.random() * 3)];
            
            document.getElementById('rpsEmoji').textContent = emojis[botChoice];
            
            let result = '';
            if (choice === botChoice) {
                result = `🤝 مساوی!\nتو: ${names[choice]}\nبات: ${names[botChoice]}`;
            } else if (
                (choice === 'rock' && botChoice === 'scissors') ||
                (choice === 'paper' && botChoice === 'rock') ||
                (choice === 'scissors' && botChoice === 'paper')
            ) {
                result = `🎉 بردی!\nتو: ${names[choice]}\nبات: ${names[botChoice]}`;
            } else {
                result = `😅 باختی!\nتو: ${names[choice]}\nبات: ${names[botChoice]}`;
            }
            
            document.getElementById('rpsResult').textContent = result;
        }
        
        // بازی شیر یا خط
        function playCoin(choice) {
            const result = Math.random() < 0.5 ? 'shir' : 'khat';
            const emojis = {shir: '🦁', khat: '🔢'};
            const names = {shir: 'شیر', khat: 'خط'};
            
            document.getElementById('coinEmoji').textContent = emojis[result];
            document.getElementById('coinEmoji').style.animation = 'none';
            setTimeout(() => {
                document.getElementById('coinEmoji').style.animation = 'flip 1s ease-out';
            }, 10);
            
            let resultText = '';
            if (choice === result) {
                resultText = `🎉 بردی!\nانتخاب تو: ${names[choice]}\nسکه: ${names[result]}`;
            } else {
                resultText = `😅 باختی!\nانتخاب تو: ${names[choice]}\nسکه: ${names[result]}`;
            }
            
            document.getElementById('coinResult').textContent = resultText;
        }
        
        // بازی دوز
        let tttBoard = Array(9).fill('');
        let tttGameOver = false;
        
        function resetTTT() {
            tttBoard = Array(9).fill('');
            tttGameOver = false;
            document.getElementById('tttResult').textContent = 'نوبت تو (⭕)';
            renderTTT();
        }
        
        function renderTTT() {
            const board = document.getElementById('tttBoard');
            board.innerHTML = '';
            
            tttBoard.forEach((cell, index) => {
                const div = document.createElement('div');
                div.className = 'cell ' + (cell === 'X' ? 'x' : cell === 'O' ? 'o' : '');
                div.textContent = cell === 'X' ? '❌' : cell === 'O' ? '⭕' : '';
                div.onclick = () => tttMove(index);
                board.appendChild(div);
            });
        }
        
        function tttMove(index) {
            if (tttBoard[index] || tttGameOver) return;
            
            tttBoard[index] = 'O';
            renderTTT();
            
            if (checkWin('O')) {
                document.getElementById('tttResult').textContent = '🎉 بردی!';
                tttGameOver = true;
                return;
            }
            
            if (tttBoard.every(cell => cell)) {
                document.getElementById('tttResult').textContent = '🤝 مساوی!';
                tttGameOver = true;
                return;
            }
            
            setTimeout(() => {
                botMove();
                renderTTT();
                
                if (checkWin('X')) {
                    document.getElementById('tttResult').textContent = '😅 باختی!';
                    tttGameOver = true;
                } else if (tttBoard.every(cell => cell)) {
                    document.getElementById('tttResult').textContent = '🤝 مساوی!';
                    tttGameOver = true;
                } else {
                    document.getElementById('tttResult').textContent = 'نوبت تو (⭕)';
                }
            }, 500);
        }
        
        function botMove() {
            // بات ساده: اول سعی می‌کنه ببره، بعد دفاع کنه، بعد تصادفی
            for (let i = 0; i < 9; i++) {
                if (!tttBoard[i]) {
                    tttBoard[i] = 'X';
                    if (checkWin('X')) return;
                    tttBoard[i] = '';
                }
            }
            
            for (let i = 0; i < 9; i++) {
                if (!tttBoard[i]) {
                    tttBoard[i] = 'O';
                    if (checkWin('O')) {
                        tttBoard[i] = 'X';
                        return;
                    }
                    tttBoard[i] = '';
                }
            }
            
            if (!tttBoard[4]) {
                tttBoard[4] = 'X';
                return;
            }
            
            const corners = [0, 2, 6, 8].filter(i => !tttBoard[i]);
            if (corners.length) {
                tttBoard[corners[Math.floor(Math.random() * corners.length)]] = 'X';
                return;
            }
            
            const empty = tttBoard.map((cell, i) => cell ? null : i).filter(i => i !== null);
            if (empty.length) {
                tttBoard[empty[Math.floor(Math.random() * empty.length)]] = 'X';
            }
        }
        
        function checkWin(player) {
            const wins = [
                [0, 1, 2], [3, 4, 5], [6, 7, 8],
                [0, 3, 6], [1, 4, 7], [2, 5, 8],
                [0, 4, 8], [2, 4, 6]
            ];
            return wins.some(combo => combo.every(i => tttBoard[i] === player));
        }
        
        renderTTT();
    </script>
</body>
</html>
